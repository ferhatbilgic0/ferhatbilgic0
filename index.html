<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülke Tahmin Yarışması</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #game-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #map {
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        #game-status {
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        #answer-form {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        #answer-input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 2px solid #3498db;
            border-radius: 5px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #score {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        #waiting-screen {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-status">Rakip bekleniyor...</div>
        <div id="score">Skor: 0</div>
        <div id="map"></div>
        <form id="answer-form">
            <input type="text" id="answer-input" placeholder="Ülke adını yazın..." autocomplete="off">
            <button type="submit">Tahmin Et</button>
        </form>
        <div id="waiting-screen">Oyuncu aranıyor...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
